name: Build iPhone app

on:
  workflow_dispatch:
    inputs:
      variant:
        description: personal or public
        default: personal
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  APP_VARIANT: ${{ inputs.variant || 'personal' }}

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios --clean --non-interactive
      - name: Build unsigned app
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath build/app.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40
          mkdir -p Payload
          cp -R build/app.xcarchive/Products/Applications/*.app Payload/
          APP=$(ls -d Payload/*.app | head -1)
          find "$APP" \( -name "*.framework" -o -name "*.dylib" \) -print0 | xargs -0 -I{} codesign -f -s - {}
          for X in "$APP"/PlugIns/*.appex; do
            NAME=$(basename "$X" .appex)
            codesign -f -s - --entitlements "ios/.targets/$NAME/generated.entitlements" "$X"
          done
          codesign -f -s - --entitlements "$(ls ios/*/*.entitlements | head -1)" "$APP"
          codesign -d --entitlements - "$APP" "$APP"/PlugIns/*.appex
          zip -qr Familiar.ipa Payload
      - name: Keep the test build
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Familiar-${{ env.APP_VARIANT }}-${{ github.run_number }}
          path: Familiar.ipa
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Familiar.ipa --title "Familiar (build ${{ github.run_number }})" \
            --notes "Download Familiar.ipa on your iPhone and open it with AltStore or Sideloadly."
